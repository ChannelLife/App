name: Deploy ChannelLife to GitHub Pages

on:
  push:
    branches: ['main', 'master']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install dependencies
        run: npm install --legacy-peer-deps --no-audit --no-fund
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Build project
        run: |
          RAW_BASE="${{ steps.pages.outputs.base_path }}"
          if [ -n "$RAW_BASE" ]; then
            BASE_PATH="${RAW_BASE%/}/"
          elif [ "${{ github.event.repository.name }}" = "${{ github.repository_owner }}.github.io" ] || [ -f public/CNAME ] || [ -f CNAME ]; then
            BASE_PATH="/"
          else
            BASE_PATH="/${{ github.event.repository.name }}/"
          fi
          echo "Building Vite with base=$BASE_PATH"
          npm run build -- --base="$BASE_PATH"
      - name: Verify build output
        run: ls -la ./dist && test -f ./dist/index.html && grep -E "assets/index-" ./dist/index.html
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: './dist'
          include-hidden-files: true

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
